# Builds the site and deploys it to GitHub Pages.
#
# Assumes the repository is named elaakarsh31.github.io, which serves from the root (base '/').
# For any other repository name the site lives at https://<user>.github.io/<repo>/, so set
# BASE_PATH below to '/<repo>/' (leading and trailing slash).
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prebuild regenerates src/content/resume.generated.json from the .tex.
      - run: npm run build
        env:
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
